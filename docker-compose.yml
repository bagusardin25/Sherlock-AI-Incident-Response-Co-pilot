version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sherlock-postgres
    environment:
      POSTGRES_USER: sherlock
      POSTGRES_PASSWORD: sherlock_dev_password
      POSTGRES_DB: sherlock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sherlock"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
