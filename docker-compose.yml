version: '3.8'

services:
  # ── Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sherlock-postgres
    environment:
      POSTGRES_USER: sherlock
      POSTGRES_PASSWORD: sherlock_dev_password
      POSTGRES_DB: sherlock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sherlock"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend (FastAPI) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sherlock-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override database URL to point to the Docker postgres service
      SHERLOCK_DATABASE_URL: postgresql+asyncpg://sherlock:sherlock_dev_password@postgres:5432/sherlock_db
      SHERLOCK_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    volumes:
      - ./fixtures:/app/../fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Next.js) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sherlock-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
